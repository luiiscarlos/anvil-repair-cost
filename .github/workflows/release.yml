name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el tag coincide con la versión del mod
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag_version" != "$mod_version" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con version=$mod_version en gradle.properties" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y ejecutar tests
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/anvil-repair-cost-*.jar
          if-no-files-found: error

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      - name: Crear release (solo el .jar del mod, sin -sources)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="$(ls dist/anvil-repair-cost-*.jar | grep -v -- '-sources' | head -n 1)"
          gh release create "$GITHUB_REF_NAME" "$jar" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
